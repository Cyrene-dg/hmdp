server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  redis:
    #host: 192.168.223.128
    database: 1
    host: 127.0.0.1
    port: 6379
#    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null # ignore null fields in JSON
mybatis-plus:
  type-aliases-package: com.hmdp.entity # entity aliases
logging:
  level:
    com.hmdp: debug

auth:
  mode: hybrid

legacy:
  hmdp:
    # 青禾运行边界默认不注册旧点评接口；仅在回看历史功能时显式开启。
    endpoints-enabled: ${LEGACY_HMDP_ENDPOINTS_ENABLED:false}

qinghe:
  pos:
    allowed-clock-skew-seconds: ${QINGHE_POS_CLOCK_SKEW_SECONDS:300}
    execution:
      core-size: ${QINGHE_POS_CORE_SIZE:4}
      max-size: ${QINGHE_POS_MAX_SIZE:8}
      queue-capacity: ${QINGHE_POS_QUEUE_CAPACITY:64}
      max-in-flight: ${QINGHE_POS_MAX_IN_FLIGHT:72}
      timeout-ms: ${QINGHE_POS_TIMEOUT_MS:3000}
  outbox:
    publisher:
      enabled: ${QINGHE_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: ${QINGHE_OUTBOX_BATCH_SIZE:50}
      lease-seconds: ${QINGHE_OUTBOX_LEASE_SECONDS:30}
      max-retries: ${QINGHE_OUTBOX_MAX_RETRIES:8}
      scan-delay-ms: ${QINGHE_OUTBOX_SCAN_DELAY_MS:1000}
      confirm-timeout-ms: ${QINGHE_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
  claim:
    execution:
      core-size: ${QINGHE_CLAIM_CORE_SIZE:8}
      max-size: ${QINGHE_CLAIM_MAX_SIZE:16}
      queue-capacity: ${QINGHE_CLAIM_QUEUE_CAPACITY:128}
      max-in-flight: ${QINGHE_CLAIM_MAX_IN_FLIGHT:144}
      timeout-ms: ${QINGHE_CLAIM_TIMEOUT_MS:3000}
    consumer:
      enabled: ${QINGHE_CLAIM_CONSUMER_ENABLED:false}
      max-attempts: ${QINGHE_CLAIM_CONSUMER_MAX_ATTEMPTS:4}
      retry-initial-ms: ${QINGHE_CLAIM_CONSUMER_RETRY_INITIAL_MS:200}
      retry-max-ms: ${QINGHE_CLAIM_CONSUMER_RETRY_MAX_MS:2000}
    failure-recovery:
      enabled: ${QINGHE_CLAIM_FAILURE_RECOVERY_ENABLED:false}
      batch-size: ${QINGHE_CLAIM_FAILURE_BATCH_SIZE:50}
      compensating-seconds: ${QINGHE_CLAIM_COMPENSATING_SECONDS:30}
      scan-delay-ms: ${QINGHE_CLAIM_FAILURE_SCAN_DELAY_MS:5000}
    recovery:
      enabled: ${QINGHE_CLAIM_RECOVERY_ENABLED:false}
      orphan-seconds: ${QINGHE_CLAIM_ORPHAN_SECONDS:120}
      scan-delay-ms: ${QINGHE_CLAIM_RECOVERY_SCAN_DELAY_MS:30000}
  entitlement:
    right-code-key-base64: ${QINGHE_RIGHT_CODE_KEY_BASE64:}
    expiry:
      enabled: ${QINGHE_ENTITLEMENT_EXPIRY_ENABLED:false}
      scan-delay-ms: ${QINGHE_ENTITLEMENT_EXPIRY_SCAN_DELAY_MS:60000}
  reconciliation:
    import-chunk-size: ${QINGHE_RECON_IMPORT_CHUNK_SIZE:500}
    match-chunk-size: ${QINGHE_RECON_MATCH_CHUNK_SIZE:200}
    file:
      base-directory: ${QINGHE_RECON_BASE_DIR:}
      scheduler-enabled: ${QINGHE_RECON_FILE_SCHEDULER_ENABLED:false}
      scan-delay-ms: ${QINGHE_RECON_FILE_SCAN_DELAY_MS:60000}
      final-arrival-time: ${QINGHE_RECON_FINAL_ARRIVAL_TIME:03:00}
  operations:
    stuck-seconds: ${QINGHE_OPERATIONS_STUCK_SECONDS:300}
    settlement-pending-seconds: ${QINGHE_OPERATIONS_SETTLEMENT_PENDING_SECONDS:86400}
